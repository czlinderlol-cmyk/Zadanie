<main>
  <h2>Contact form</h2>

  <form id="contactForm">
    <label>Name:
      <input type="text" id="name" required>
    </label>

    <label>Email:
      <input type="email" id="email" required>
    </label>

    <label>Message:
      <textarea id="message" required></textarea>
    </label>

    <fieldset>
      <legend>Type of request</legend>
      <label><input type="radio" name="type" value="question"> Question</label>
      <label><input type="radio" name="type" value="feedback"> Feedback</label>
    </fieldset>

    <label>
      <input type="checkbox" id="agree"> I agree with data processing
    </label>

    <button type="submit">Send</button>
  </form>

  <p id="formMessage"></p>
</main>
